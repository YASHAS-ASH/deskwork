<!doctype html><html lang="en"><head><title>Deskwork</title>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: slim app rail on the left, colored title bar, tabbed ribbon, document canvas, status bar. Each app owns one accent. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --rail:#e4e7ee; --ink:#1c2230; --muted:#667085; --line:#d5d9e2;
  --ribbon:#f8f9fb; --hover:#e6e9f0; --paper:#ffffff; --paper-ink:#1b1b1b; --canvas:#dfe3ea;
  --accent:#5a4fcf; --accent-ink:#ffffff; --good:#1f7a4d;
  --ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --doc:'Carlito',Calibri,'Segoe UI',sans-serif;
  --a-home:#5a4fcf; --a-writer:#2b579a; --a-sheets:#217346; --a-slides:#b7472a; --a-reader:#202124;
}
:root[data-theme="dark"]{
  --bg:#14171d; --surface:#1c2028; --rail:#191c23; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2e3441;
  --ribbon:#1f232c; --hover:#2a3040; --paper:#23272f; --paper-ink:#e8ebf2; --canvas:#12141a;
  --a-home:#8c84f0; --a-writer:#4f84ea; --a-sheets:#34a56f; --a-slides:#e0743d; --a-reader:#e0525f; --good:#4cc38a; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;display:grid;grid-template-columns:64px minmax(0,1fr);background:var(--bg)}
#app[data-app="home"]{--accent:var(--a-home)}
#app[data-app="writer"]{--accent:var(--a-writer)}
#app[data-app="sheets"]{--accent:var(--a-sheets)}
#app[data-app="slides"]{--accent:var(--a-slides)}
#app[data-app="reader"]{--accent:var(--a-reader)}

/* rail */
#rail{background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-right:1px solid var(--line)}
.rbtn{width:52px;border:0;background:none;border-radius:8px;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:500}
.rbtn:hover{background:var(--hover)}
.rbtn[aria-current="true"]{color:var(--ink);background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.glyph{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.rbtn .glyph{background:var(--c)}
.g-home{--c:var(--a-home)}.g-writer{--c:var(--a-writer)}.g-sheets{--c:var(--a-sheets)}.g-slides{--c:var(--a-slides)}.g-reader{--c:var(--a-reader)}

/* main column */
#main{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;min-height:0;overflow:hidden}
#titlebar{grid-row:1}#ribbonwrap{grid-row:2;min-width:0;overflow:hidden}#stage{grid-row:3}#statusbar{grid-row:4}
html,body{overflow:hidden;overscroll-behavior:none}#app{overflow:hidden}
#titlebar{background:var(--accent);color:#fff;display:flex;align-items:center;gap:14px;padding:env(safe-area-inset-top,0px) 14px 0;height:calc(46px + env(safe-area-inset-top,0px))}
#titlebar .brand{font-weight:700;letter-spacing:.2px;white-space:nowrap}
#docname{background:transparent;border:1px solid transparent;border-radius:5px;padding:4px 8px;color:#fff;min-width:0;width:min(34ch,36vw);font-weight:500}
#docname:hover,#docname:focus{border-color:rgba(255,255,255,.55);background:rgba(255,255,255,.12)}
#search{margin-left:auto;display:flex;align-items:center;background:rgba(255,255,255,.18);border-radius:6px;padding:0 10px;height:30px;width:min(300px,34vw)}
#search input{background:none;border:0;outline:0;color:#fff;width:100%}
#search input::placeholder{color:rgba(255,255,255,.8)}
.tbtn{background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:6px;height:30px;padding:0 12px;font-weight:600;white-space:nowrap}
.tbtn:hover{background:rgba(255,255,255,.28)}

/* ribbon */
#ribbonwrap{background:var(--ribbon);border-bottom:1px solid var(--line)}
#tabs{display:flex;gap:2px;padding:0 10px;overflow-x:auto}
.tab{border:0;background:none;padding:8px 14px 7px;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#ribbon{display:flex;overflow-x:auto;padding:6px 10px 8px;gap:0;min-height:66px;align-items:stretch}
.group{display:flex;flex-direction:column;justify-content:space-between;padding:0 10px;border-right:1px solid var(--line);flex:none}
.group:last-child{border-right:0}
.group .row{display:flex;gap:2px;align-items:center;flex-wrap:nowrap;min-height:40px}
.group .gl{font-size:10.5px;color:var(--muted);text-align:center;margin-top:3px}
.rb{border:1px solid transparent;background:none;border-radius:5px;min-width:32px;height:32px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-weight:600;white-space:nowrap}
.rb:hover{background:var(--hover)}
.rb[aria-pressed="true"]{background:var(--hover);border-color:var(--line)}
.rb.big{flex-direction:column;height:44px;gap:0;font-size:11px;font-weight:500;padding:0 10px}
.rb.big b{font-size:17px;line-height:1.1}
.rsel{height:30px;border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:0 6px}
input[type=color].rb{padding:2px;width:32px}
.sep{width:1px;background:var(--line);height:22px;margin:0 4px}

/* canvas */
#stage{min-height:0;min-width:0;position:relative;display:flex;flex-direction:column}
.view{display:none;min-height:0;flex:1}
.view.on{display:flex}
#statusbar{display:flex;gap:18px;align-items:center;padding:0 14px;height:26px;background:var(--ribbon);border-top:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden}
#statusbar .sp{margin-left:auto}
#toast{position:fixed;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.on{opacity:1}
#drop{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--accent) 82%,transparent);color:#fff;display:none;place-items:center;font-size:22px;font-weight:700}
#drop.on{display:grid}

/* home */
#v-home{overflow:auto;padding:26px max(20px,4vw)}
.home{width:100%;max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.home h1{margin:0;font-size:28px;font-weight:700;text-wrap:balance}
.home h2{margin:0 0 10px;font-size:13px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;text-align:left}
.tile:hover{border-color:var(--c);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.tile .glyph{background:var(--c);width:34px;height:34px}
.tile span{font-weight:600}.tile small{color:var(--muted);font-weight:400;display:block;margin-top:2px}
.drophint{border:2px dashed var(--line);border-radius:12px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.drophint p{margin:0;color:var(--muted);flex:1;min-width:220px}
.pbtn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:7px;padding:9px 18px;font-weight:600}
.pbtn:hover{filter:brightness(1.1)}
.rec{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.rec td,.rec th{padding:10px 14px;text-align:left;border-bottom:1px solid var(--line)}
.rec th{font-size:12px;color:var(--muted);font-weight:600;background:var(--ribbon)}
.rec tr:last-child td{border-bottom:0}
.rec tbody tr{cursor:pointer}.rec tbody tr:hover td{background:var(--hover)}
.rec .fn{display:flex;gap:10px;align-items:center;font-weight:500}
.rec .glyph{width:24px;height:24px;font-size:12px;background:var(--c);flex:none}
.tablewrap{overflow-x:auto;border-radius:10px}

/* writer */
#v-writer{background:var(--canvas);overflow:auto;justify-content:flex-start;padding:20px 12px;touch-action:pan-x pan-y}
#paper{background:var(--paper);color:var(--paper-ink);height:fit-content;box-shadow:0 2px 14px rgba(0,0,0,.18);font-family:var(--doc);font-size:calc(15px*var(--z,1));line-height:1.5;outline:0;overflow-wrap:anywhere;flex:none;margin:0 auto}
#paper[data-mode="mobile"]{width:min(816px,100%);min-height:100%;padding:24px 20px}
#paper[data-mode="mobile"] table{display:block;overflow-x:auto}
#paper[data-mode="print"]{width:816px;min-height:1056px;padding:72px 80px}
#paper h1{font-size:1.5em;font-weight:400;line-height:1.2;margin:.8em 0 .3em;color:#2f5496}
#paper h1.dwtitle{font-size:2.3em;color:#1b1b1b;margin:0 0 .3em}
#paper .dwsub{color:#5a5a5a;font-size:1.15em;letter-spacing:.4px}
#paper h2{font-size:1.25em;font-weight:400;margin:.9em 0 .3em;color:#2f5496}
#paper h3{font-size:1.1em;font-weight:400;margin:.8em 0 .3em;color:#1f3763}
#paper p{margin:0 0 .6em}
#paper table{border-collapse:collapse;max-width:100%}#paper td,#paper th{border:1px solid #a6a6a6;padding:4px 8px}
#paper img{max-width:100%}

/* sheets */
#v-sheets{flex-direction:column;background:var(--surface)}
#fbar{display:flex;align-items:center;border-bottom:1px solid var(--line);background:var(--ribbon)}
#namebox{width:84px;border:0;border-right:1px solid var(--line);background:transparent;padding:6px 8px;text-align:center;font-weight:600}
.fx{padding:0 10px;color:var(--muted);font-style:italic;font-family:serif}
#fx{flex:1;border:0;background:transparent;padding:6px 4px;min-width:0}
#gridwrap{flex:1;min-height:0;overflow:auto;outline:0}
table.grid{border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
.grid th,.grid td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);height:24px;padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid thead th{position:sticky;top:0;background:var(--rail);color:var(--muted);font-weight:500;z-index:2;width:96px}
.grid tbody th{position:sticky;left:0;background:var(--rail);color:var(--muted);font-weight:500;width:46px;z-index:1;text-align:center}
.grid thead th:first-child{left:0;z-index:3;width:46px}
.grid td.sel{outline:2px solid var(--accent);outline-offset:-2px;background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.grid td.num{text-align:right}
.grid td[contenteditable="true"]{text-overflow:clip;background:var(--surface)}
#sheettabs{display:flex;gap:2px;border-top:1px solid var(--line);background:var(--ribbon);padding:0 8px;overflow-x:auto}
.stab{border:0;background:none;padding:6px 14px;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.stab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;background:var(--surface)}

/* slides */
#v-slides{background:var(--canvas)}
#thumbs{width:176px;flex:none;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px;border-right:1px solid var(--line);background:var(--rail)}
.thumb{display:flex;gap:6px;align-items:flex-start;background:none;border:0;padding:0;text-align:left}
.thumb i{font-style:normal;font-size:11px;color:var(--muted);width:14px;text-align:right;padding-top:4px}
.mini{flex:1;aspect-ratio:16/9;background:var(--paper);color:var(--paper-ink);border:2px solid transparent;border-radius:4px;box-shadow:0 0 0 1px var(--line);padding:6px;overflow:hidden;font-size:8px;line-height:1.25;min-width:0}
.mini b{display:block;font-size:9px;margin-bottom:2px;color:var(--a-slides)}
.thumb[aria-current="true"] .mini{border-color:var(--accent)}
#slidearea{flex:1;min-width:0;display:grid;place-items:center;padding:20px;overflow:auto}
#slide{width:min(100%,calc((100vh - 240px)*16/9),960px);min-width:280px;aspect-ratio:16/9;background:var(--paper);color:var(--paper-ink);box-shadow:0 2px 16px rgba(0,0,0,.25);padding:6% 7%;display:flex;flex-direction:column;gap:3%;overflow:hidden;container-type:inline-size;border-left:1.2% solid var(--a-slides)}
#slide h1{margin:0;font-size:5.2cqw;line-height:1.15;outline:0;font-family:var(--doc)}
#slide ul{margin:0;padding-left:1.6em;font-size:2.7cqw;line-height:1.45;outline:0;font-family:var(--doc)}
#slide [contenteditable]:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
#present{position:fixed;inset:0;background:#000;z-index:60;display:none;place-items:center;cursor:pointer}
#present.on{display:grid}
#present .ps{width:min(100vw,100vh*16/9);aspect-ratio:16/9;background:#fff;color:#1b1b1b;padding:6% 7%;container-type:inline-size;display:flex;flex-direction:column;gap:3%;font-family:var(--doc);border-left:1.2cqw solid var(--a-slides)}
#present h1{margin:0;font-size:5.2cqw}#present ul{margin:0;font-size:2.7cqw;line-height:1.5;padding-left:1.6em}

/* reader */
#v-reader{background:var(--canvas);overflow:auto;flex-direction:column;align-items:flex-start;padding:12px;gap:10px;touch-action:pan-x pan-y}
#v-reader canvas,#v-reader img.pg{box-shadow:0 2px 14px rgba(0,0,0,.25);background:#fff;max-width:none;flex:none;margin:0 auto}
.empty{margin:auto;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center;max-width:380px}
.empty h3{margin:0;color:var(--ink);font-size:18px}

[hidden]{display:none!important}
#v-reader{background:#525659;position:relative}
#app[data-app="reader"]{--accent:#202124;grid-template-columns:minmax(0,1fr)}
#app[data-app="reader"] #rail,#app[data-app="reader"] #statusbar,#app[data-app="reader"] #ribbonwrap{display:none}
#app[data-app="reader"] #main{grid-template-rows:auto minmax(0,1fr)}
#app[data-app="reader"] #stage{grid-row:2}
#docxHost{display:none;margin:0 auto;width:max-content;min-width:100%;flex:none}
#docxHost .docx-wrapper{background:transparent!important;padding:8px 0!important}
#docxHost section.docx{box-shadow:0 1px 8px rgba(0,0,0,.3)!important;margin-bottom:10px!important}
#modeBtn{width:auto!important;padding:0 12px;font-size:12px!important;border-right:1px solid var(--line)!important}
.pgbox{background:#fff;flex:none;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.45);position:relative}
.pgbox canvas{display:block}
#pill{position:absolute;left:12px;bottom:12px;background:rgba(32,33,36,.92);color:#fff;border-radius:16px;padding:5px 12px;font-size:13px;font-weight:600;z-index:5;pointer-events:none}
#busy{position:fixed;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.28);z-index:55;color:#fff;font-weight:600;font-size:16px}
#busy span{background:rgba(20,22,28,.9);padding:14px 22px;border-radius:12px}
#backBtn{padding:0 11px;font-size:20px;line-height:1}
#zoomctl{position:absolute;right:12px;bottom:12px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:0 2px 10px rgba(0,0,0,.3);z-index:6;overflow:hidden}
#zoomctl button{width:44px;height:42px;border:0;background:none;font-size:22px;font-weight:600}
#zoomctl button:active{background:var(--hover)}
#zlabel{min-width:52px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}
#findbar{display:none;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line)}
#findbar.on{display:flex}
#fi{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--surface)}
#editBtn{display:none}
@media (max-width:700px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #rail{order:2;flex-direction:row;justify-content:space-around;border-right:0;border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px))}
  #titlebar .brand{display:none}
  #docname{flex:1;width:auto}#search{display:none}
  #editBtn{display:inline-block}
  #app[data-app="home"] #editBtn,#app[data-app="home"] #ribbonwrap,#app[data-app="reader"] #editBtn{display:none}
  body:not(.ribbon-open) #ribbonwrap{display:none}
  .group .gl{display:none}.group{padding:0 6px}#ribbon{min-height:0;padding:4px 8px}.group .row{min-height:36px}
  #statusbar{height:22px;font-size:11px}
  #v-writer{padding:0}
  #paper[data-mode="mobile"]{padding:16px 14px;box-shadow:none}
  #app:not([data-app="home"]) #openBtn{display:none}
  #v-slides{flex-direction:column-reverse}
  #thumbs{width:auto;flex-direction:row;border-right:0;border-top:1px solid var(--line);overflow-x:auto;overflow-y:hidden;padding:8px}
  .thumb{width:112px;flex:none}.mini{font-size:6px}
  #slidearea{padding:10px;display:block}
  #slide{min-width:0;width:100%}
  #v-home{padding:18px 14px}
  .home h1{font-size:23px}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  #titlebar{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

#bnav,#newsheet{display:none}
#bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 18px;border-radius:8px;color:var(--muted);font-size:11px;font-weight:500}
#bnav button[aria-current="true"]{color:var(--accent)}
#bnav svg{width:24px;height:24px}
#newsheet.on{display:flex;position:fixed;inset:0;z-index:58;background:rgba(0,0,0,.4);align-items:flex-end}
#newsheet .sheet{width:100%;background:var(--surface);border-radius:16px 16px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#newsheet h3{margin:0 0 6px;font-size:15px}
#newsheet button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:10px 6px;font-size:16px;font-weight:500;text-align:left;border-radius:8px}
#newsheet button:active{background:var(--hover)}
.rb svg,.rb.big b svg{display:block}
.tbtn svg{width:18px;height:18px;vertical-align:-4px}
@media (max-width:700px){
  #rail{display:none}
  #app{grid-template-rows:minmax(0,1fr) auto}
  #bnav{display:flex;order:2;justify-content:space-around;background:var(--rail);border-top:1px solid var(--line);padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px))}
  #app:not([data-app="home"]) #bnav{display:none}
  #main{grid-template-rows:auto minmax(0,1fr) auto}
  #stage{grid-row:2}
  #ribbonwrap{grid-row:3;border-top:1px solid var(--line);border-bottom:0}
  #statusbar{display:none}
  #app[data-app="home"] #titlebar .brand{display:inline}
  #app[data-app="home"] #search{display:flex;flex:1;width:auto;margin-left:0}
  #openBtn{display:none!important}
  .tl{display:none}
  .tbtn{height:34px;padding:0 10px}
  #zoomctl{right:8px;bottom:8px}
  #zoomctl button{height:36px;width:38px;font-size:20px}
  #zoomctl #modeBtn{width:auto}
  #zlabel{min-width:46px;font-size:12px}
}
#v-reader{padding:8px}
#pgwrap{display:flex;flex-direction:column;align-items:center;gap:10px;width:max-content;min-width:100%}
</style>

</head><body><div id="app" data-app="home">
  <nav id="rail" aria-label="Apps"></nav>
  <div id="main">
    <header id="titlebar">
      <span class="brand">Deskwork</span>
      <button class="tbtn" id="backBtn" type="button" aria-label="Back to Home">‹</button>
      <input id="docname" aria-label="Document name" spellcheck="false">
      <label id="search"><input id="q" type="search" placeholder="Search your files" aria-label="Search your files"></label>
      <button class="tbtn" id="shareBtn" type="button" aria-label="Share"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.4M8.2 13.2l7.6 4.4"/></svg><span class="tl"> Share</span></button>

<script>
(function(){

const busy=on=>{$('#busy').hidden=!on};
const MIMEEXT={'application/pdf':'pdf','application/vnd.openxmlformats-officedocument.wordprocessingml.document':'docx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':'xlsx','application/vnd.openxmlformats-officedocument.presentationml.presentation':'pptx','application/msword':'doc','application/vnd.ms-excel':'xls','text/csv':'csv','text/plain':'txt'};
window.__dwIntent=async function(){
  const N=window.DeskworkNative;if(!N)return;
  let info;try{info=N.info()}catch(e){return}
  if(!info)return;
  busy(true);
  try{
    const m=JSON.parse(info);
    if((/\.pdf$/i.test(m.name||'')||m.mime==='application/pdf')&&N.pdfFromPending){
      const nm=m.name||'file.pdf',d=addDoc({kind:'reader',name:/\.pdf$/i.test(nm)?nm:nm+'.pdf',type:'pdfn',zoom:1});

const $=s=>document.querySelector(s);

/* ---------- rail ---------- */
function buildRail(){

function go(v){

}
function renderAll(){

}

/* ---------- ribbon ---------- */

const P=d=>'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>';
const MG='<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>';
const ICONC={
 undo:P('<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>'),
 redo:P('<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/>'),
 insertUnorderedList:P('<circle cx="5" cy="7" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="17" r="1"/><path d="M10 7h10M10 12h10M10 17h10"/>'),

 justifyCenter:P('<path d="M4 6h16M7 10h10M4 14h16M7 18h10"/>'),
 justifyRight:P('<path d="M4 6h16M10 10h10M4 14h16M10 18h10"/>'),
 justifyFull:P('<path d="M4 6h16M4 10h16M4 14h16M4 18h16"/>'),
 indent:P('<path d="M4 6h16M12 10h8M12 14h8M4 18h16"/><path d="M4 9l3 3-3 3"/>'),
 outdent:P('<path d="M4 6h16M12 10h8M12 14h8M4 18h16"/><path d="M7 9l-3 3 3 3"/>'),
 removeFormat:P('<path d="M5 5h14M10 5l-3 14M14 13l6 6M20 13l-6 6"/>'),
 insertHorizontalRule:P('<path d="M4 12h16"/>'),
 'w:zoomout':P(MG+'<path d="M8 11h6"/>'),'w:zoomin':P(MG+'<path d="M8 11h6M11 8v6"/>'),
 'w:find':P(MG),
 'w:table':P('<rect x="4" y="5" width="16" height="14" rx="1"/><path d="M4 10h16M4 15h16M10 5v14M15 5v14"/>'),
 'w:pic':P('<rect x="4" y="5" width="16" height="14" rx="1"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/>'),
 'w:link':P('<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'),
 'w:date':P('<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/>'),
 'w:mobile':P('<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>'),
 'w:print':P('<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>'),
 'w:zoom100':P('<path d="M7 8l2-1v10M13 7h4v10h-4z"/>'),
 'w:fit':P('<path d="M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/>'),
 'r:prev':P('<path d="M15 5l-7 7 7 7"/>'),'r:next':P('<path d="M9 5l7 7-7 7"/>'),
 'r:out':P(MG+'<path d="M8 11h6"/>'),'r:in':P(MG+'<path d="M8 11h6M11 8v6"/>'),'r:fit':P('<path d="M4 12h16M7 9l-3 3 3 3M17 9l3 3-3 3"/>'),
 'p:add':P('<path d="M12 5v14M5 12h14"/>'),'p:dup':P('<rect x="8" y="8" width="11" height="11" rx="1"/><path d="M5 15V6a1 1 0 011-1h9"/>'),
 'p:del':P('<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>'),'p:up':P('<path d="M12 19V5M6 11l6-6 6 6"/>'),'p:down':P('<path d="M12 5v14M6 13l6 6 6-6"/>'),
 'p:start':P('<path d="M7 5l12 7-12 7z"/>'),'p:cur':P('<path d="M7 5l12 7-12 7z"/>'),
 's:sum':P('<path d="M18 5H7l6 7-6 7h11"/>'),'s:addrow':P('<path d="M12 7v10M7 12h10"/>'),'s:addcol':P('<path d="M12 7v10M7 12h10"/>'),'s:delrow':P('<path d="M7 12h10"/>'),'s:clear':P('<path d="M18 6L6 18M6 6l12 12"/>'),'s:newsheet':P('<path d="M12 5v14M5 12h14"/>'),
 open:P('<path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>')
};
const B=(label,cmd,o={})=>({label,cmd,...o});
function ribbonDef(){
  if(view==='home')return {tabs:['Home'],groups:[{n:'File',items:[B('Open','open',{big:1,g:'↥'}),B('New document','new:writer',{big:1,g:'W'}),B('New workbook','new:sheets',{big:1,g:'S'}),B('New slides','new:slides',{big:1,g:'P'})]}]};
  if(view==='writer'){
    const home=[
      {n:'History',items:[B('↶','undo',{t:'Undo'}),B('↷','redo',{t:'Redo'})]},
      {n:'Font',items:[{sel:'fontName',opts:['Carlito','Georgia','Courier New','Arial','Times New Roman']},{sel:'fontSize',opts:[['1','8'],['2','10'],['3','12'],['4','14'],['5','18'],['6','24'],['7','36']],def:'3'},B('B','bold',{t:'Bold (Ctrl+B)',tog:1}),B('I','italic',{t:'Italic',tog:1}),B('U','underline',{t:'Underline',tog:1}),B('S̶','strikeThrough',{t:'Strikethrough',tog:1}),{color:'foreColor'},{color:'hiliteColor',v:'#ffe45c'}]},
      {n:'Paragraph',items:[B('• List','insertUnorderedList',{t:'Bullets'}),B('1. List','insertOrderedList',{t:'Numbering'}),B('⇤','justifyLeft',{t:'Align left'}),B('↔','justifyCenter',{t:'Center'}),B('⇥','justifyRight',{t:'Align right'}),B('☰','justifyFull',{t:'Justify'}),B('→|','indent',{t:'Increase indent'}),B('|←','outdent',{t:'Decrease indent'})]},
      {n:'Styles',items:[{sel:'formatBlock',opts:[['p','Normal'],['h1','Title'],['h2','Heading 1'],['h3','Heading 2'],['blockquote','Quote']]},B('Clear','removeFormat',{t:'Clear formatting'})]},{n:'Find',items:[B('Find','w:find',{big:1,g:'⌕'})]}
    ];
    const ins=[{n:'Insert',items:[B('Table','w:table',{big:1,g:'▦'}),B('Line','insertHorizontalRule',{big:1,g:'—'}),B('Link','w:link',{big:1,g:'∞'}),B('Date','w:date',{big:1,g:'#'}),B('Picture','w:pic',{big:1,g:'▣'})]}];
    const vw=[{n:'Views',items:[B('Mobile view','w:mobile',{big:1,g:'M'}),B('Print layout','w:print',{big:1,g:'P'})]},{n:'Zoom',items:[B('Zoom out','w:zoomout',{big:1,g:'−'}),B('Zoom in','w:zoomin',{big:1,g:'+'}),B('100%','w:zoom100',{big:1,g:'1×'}),B('Fit width','w:fit',{big:1,g:'↔'})]}];
    return {tabs:['Home','Insert','View'],groups:tab==='Insert'?ins:tab==='View'?vw:home};
  }
  if(view==='sheets'){
    const home=[
      {n:'Cells',items:[B('B','s:b',{t:'Bold'}),B('I','s:i',{t:'Italic'}),B('⇤','s:l',{t:'Align left'}),B('↔','s:c',{t:'Center'}),B('⇥','s:r',{t:'Align right'})]},
      {n:'Editing',items:[B('Σ AutoSum','s:sum',{big:1,g:'Σ'}),B('Clear','s:clear',{big:1,g:'⌫'})]},
      {n:'Rows & columns',items:[B('Insert row','s:addrow',{big:1,g:'＋'}),B('Insert column','s:addcol',{big:1,g:'｜＋'}),B('Delete row','s:delrow',{big:1,g:'－'})]}];
    const ins=[{n:'Sheets',items:[B('New sheet','s:newsheet',{big:1,g:'＋'})]}];
    return {tabs:['Home','Insert'],groups:tab==='Insert'?ins:home};
  }
  if(view==='slides'){
    const home=[
      {n:'Slides',items:[B('New slide','p:add',{big:1,g:'＋'}),B('Duplicate','p:dup',{big:1,g:'⧉'}),B('Delete','p:del',{big:1,g:'－'})]},
      {n:'Arrange',items:[B('Move up','p:up',{big:1,g:'↑'}),B('Move down','p:down',{big:1,g:'↓'})]},
      {n:'Slide show',items:[B('From start','p:start',{big:1,g:'▶'}),B('From current','p:cur',{big:1,g:'▷'})]}];
    return {tabs:['Home'],groups:home};
  }
  if(view==='reader'){
    const home=[
      {n:'Pages',items:[B('◀','r:prev',{t:'Previous page'}),{page:1},B('▶','r:next',{t:'Next page'})]},
      {n:'Zoom',items:[B('−','r:out',{t:'Zoom out'}),B('+','r:in',{t:'Zoom in'}),B('Fit width','r:fit')]}];

}
function buildTabs(){
  const def=ribbonDef();
  $('#tabs').innerHTML=def.tabs.map(t=>`<button class="tab" role="tab" aria-selected="${t===tab}" data-tab="${t}" type="button">${t}</button>`).join('');
}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;buildTabs();buildRibbon()}});
function buildRibbon(){
  const def=ribbonDef();
  $('#ribbon').innerHTML=def.groups.map(g=>`<div class="group"><div class="row">${g.items.map(it=>{
    if(it.sel)return `<select class="rsel" data-sel="${it.sel}" aria-label="${it.sel}">${it.opts.map(o=>Array.isArray(o)?`<option value="${o[0]}"${it.def===o[0]?' selected':''}>${o[1]}</option>`:`<option>${o}</option>`).join('')}</select>`;
    if(it.color)return `<input class="rb" type="color" data-color="${it.color}" value="${it.v||'#000000'}" aria-label="${it.color==='foreColor'?'Text color':'Highlight color'}">`;
    if(it.page)return `<input class="rsel" id="pageIn" type="number" min="1" value="1" style="width:58px" aria-label="Page number"><span id="pageOf" style="color:var(--muted);padding:0 4px">/ 1</span>`;
    return `<button class="rb${it.big?' big':''}" type="button" data-cmd="${it.cmd}" ${it.tog?'data-tog="1" aria-pressed="false"':''} title="${esc(it.t||it.label)}">${it.big?`<b>${ICONC[it.cmd]||it.g}</b>${esc(it.label)}`:(ICONC[it.cmd]||esc(it.label))}</button>`}).join('')}</div><div class="gl">${g.n}</div></div>`).join('');
}
$('#ribbon').addEventListener('mousedown',e=>{if(e.target.closest('button.rb'))e.preventDefault()});
$('#ribbon').addEventListener('click',e=>{const b=e.target.closest('[data-cmd]');if(b)command(b.dataset.cmd)});
$('#ribbon').addEventListener('change',e=>{
  const s=e.target;
  if(s.dataset.sel){focusPaper();document.execCommand(s.dataset.sel==='formatBlock'?'formatBlock':s.dataset.sel,false,s.dataset.sel==='formatBlock'?'<'+s.value+'>':s.value);saveWriter()}
  if(s.dataset.color){focusPaper();document.execCommand(s.dataset.color,false,s.value);saveWriter()}
  if(s.id==='pageIn')gotoPage(+s.value);
});

function command(c){
  if(c==='open')return $('#fileInput').click();
  if(c.startsWith('new:'))return newDoc(c.slice(4),false,true);
  if(view==='writer'){
    if(wmode==='print'&&cur.writer.buf&&!['w:mobile','w:print','w:zoomin','w:zoomout','w:zoom100','w:fit','w:find'].includes(c)){toast('Page view is read-only. Switch to Mobile view to edit.');return}
    if(c==='w:table'){focusPaper();document.execCommand('insertHTML',false,'<table><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr><tr><td>&nbsp;</td><td>&nbsp;</td><td>&nbsp;</td></tr></table><p><br></p>');return saveWriter()}
    if(c==='w:date'){focusPaper();document.execCommand('insertText',false,new Date().toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'}));return saveWriter()}
    if(c==='w:link'){const sel=getSelection().toString();const u=sel&&/^(https?:)?\/\//.test(sel)?sel:'https://example.com';focusPaper();document.execCommand('createLink',false,u);return saveWriter()}
    if(c==='w:find'){const f=$('#findbar');f.classList.toggle('on');if(f.classList.contains('on'))$('#fi').focus();return}
    if(c==='w:pic')return $('#picIn').click();
    if(c==='w:mobile'||c==='w:print'){wmode=c==='w:mobile'?'mobile':'print';wz=1;return applyWriter()}
    if(c==='w:zoomin'||c==='w:zoomout'){wz=Math.min(3,Math.max(.5,+(wz*(c==='w:zoomin'?1.15:1/1.15)).toFixed(3)));return applyWriter()}
    if(c==='w:zoom100'||c==='w:fit'){wz=1;return applyWriter()}
    focusPaper();document.execCommand(c,false,null);saveWriter();syncToggles();return;
  }
  if(view==='sheets')return sheetCmd(c);
  if(view==='slides')return slideCmd(c);
  if(view==='reader')return readerCmd(c);
}
function syncToggles(){

async function openFile(f){
  const ext=(f.name.split('.').pop()||'').toLowerCase();
  if(ext==='docx'){await lib('mammoth');const ab=await f.arrayBuffer();const r=await mammoth.convertToHtml({arrayBuffer:ab.slice(0)},{styleMap:["p[style-name='Title'] => h1.dwtitle:fresh","p[style-name='Subtitle'] => p.dwsub:fresh",'u => u','strike => s']});return addDoc({kind:'writer',name:f.name,html:r.value||'<p><br></p>',buf:ab})}
  if(['txt','md'].includes(ext)){const t=await f.text();return addDoc({kind:'writer',name:f.name,html:t.split(/\n{2,}/).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')||'<p><br></p>'})}
  if(['html','htm'].includes(ext)){const t=await f.text();const dd=new DOMParser().parseFromString(t,'text/html');dd.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());dd.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)}));return addDoc({kind:'writer',name:f.name,html:dd.body.innerHTML})}

    await lib('xlsx');const wb=XLSX.read(await f.arrayBuffer(),{type:'array',sheetRows:1001});
    const sheets=wb.SheetNames.map(n=>{const ws=wb.Sheets[n];const rows=[];
      if(ws['!ref']){const rg=XLSX.utils.decode_range(ws['!ref']);
        for(let r=rg.s.r;r<=Math.min(rg.e.r,rg.s.r+999);r++){const row=[];for(let c=rg.s.c;c<=Math.min(rg.e.c,rg.s.c+99);c++){const cell=ws[XLSX.utils.encode_cell({r,c})];row.push(cell?(cell.f?'='+cell.f:(cell.v==null?'':String(cell.v))):'')}rows.push(row)}}
      return {name:n,rows,styles:{}}});

  }

    const names=Object.keys(z.files).filter(n=>/^ppt\/slides\/slide\d+\.xml$/.test(n)).sort((a,b)=>+a.match(/\d+/)[0]-+b.match(/\d+/)[0]);
    const slides=[];
    for(const n of names){const xml=new DOMParser().parseFromString(await z.files[n].async('string'),'application/xml');
      const paras=[...xml.getElementsByTagName('a:p')].map(p=>[...p.getElementsByTagName('a:t')].map(t=>t.textContent).join('')).filter(s=>s.trim());
      slides.push({title:paras[0]||'',lines:paras.slice(1)})}
    return addDoc({kind:'slides',name:f.name,slides:slides.length?slides:[{title:'',lines:[]}],active:0});
  }
  if(ext==='pdf'){
    const NN=NAT();

      const d=addDoc({kind:'reader',name:f.name,type:'pdfn',zoom:1});
      const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]||'');fr.onerror=rej;fr.readAsDataURL(f)});
      const n=NN.pdfOpenB64(d.id,b64);
      if(n>0){const z=(NN.pdfSize(0)||'612,792').split(',');d.w=+z[0];d.h=+z[1];d.pages=n;return d}
      docs.splice(docs.indexOf(d),1);cur.reader=null;
    }
    return addDoc({kind:'reader',name:f.name,type:'pdf',buf:await f.arrayBuffer(),zoom:1,page:1,fit:true});
  }
  if(['png','jpg','jpeg','gif','webp','svg'].includes(ext))return addDoc({kind:'reader',name:f.name,type:'image',url:URL.createObjectURL(f),zoom:1,page:1});
  toast('.'+ext+' files are not supported yet. Try docx, xlsx, csv, pptx, pdf, txt or an image.');return null;
}

const colName=i=>{let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
const colIdx=s=>{let n=0;for(const ch of s)n=n*26+ch.charCodeAt(0)-64;return n-1};
const isNum=v=>v!==''&&v!=null&&!isNaN(+v)&&/^\s*-?[\d.,]+(e[+-]?\d+)?\s*$/i.test(String(v).replace(/,/g,''));
const flat=a=>a.flat(Infinity);
const nums=a=>flat(a).filter(x=>typeof x==='number');
const FN={SUM:(...a)=>nums(a).reduce((x,y)=>x+y,0),AVERAGE:(...a)=>{const n=nums(a);return n.length?n.reduce((x,y)=>x+y,0)/n.length:0},MIN:(...a)=>Math.min(...nums(a)),MAX:(...a)=>Math.max(...nums(a)),COUNT:(...a)=>nums(a).length,ABS:Math.abs,ROUND:(x,n=0)=>Math.round(x*10**n)/10**n,IF:(c,a,b)=>c?a:b};
function cellVal(sh,r,c,stack){
  const raw=(sh.rows[r]&&sh.rows[r][c])||'';
  if(typeof raw==='string'&&raw[0]==='='){
    const key=r+','+c;if(stack.has(key))throw new Error('cycle');stack.add(key);
    try{
      const expr=raw.slice(1).replace(/\b([A-Z]{1,2})(\d+)(?::([A-Z]{1,2})(\d+))?\b/g,(m,c1,r1,c2,r2)=>{
        if(!c2)return JSON.stringify(cellVal(sh,r1-1,colIdx(c1),stack)??0);
        const out=[];for(let rr=Math.min(r1,r2)-1;rr<=Math.max(r1,r2)-1;rr++)for(let cc=Math.min(colIdx(c1),colIdx(c2));cc<=Math.max(colIdx(c1),colIdx(c2));cc++){const v=cellVal(sh,rr,cc,stack);out.push(v===''?null:v)}
        return JSON.stringify(out)});

function display(sh,r,c){

  z.file('word/document.xml',H+'<w:document '+WNS+'><w:body>'+(body(root)||'<w:p/>')+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>');
  return z.generateAsync({type:'base64',compression:'DEFLATE'});
}
async function exportDoc(){
  const d=cur[view];if(!d)return null;
  if(view==='writer'){saveWriter();return{name:baseName(d.name)+'.docx',mime:DOCX,b64:await buildDocx(d.html)}}
  if(view==='sheets'){
    await lib('xlsx');const wb=XLSX.utils.book_new();
    d.sheets.forEach(sh=>{const ws={};let maxC=0;
      sh.rows.forEach((row,r)=>row.forEach((raw,c)=>{if(raw===''||raw==null)return;const ref=XLSX.utils.encode_cell({r,c});
        if(String(raw)[0]==='=')ws[ref]={t:'n',f:String(raw).slice(1)};else if(isNum(raw))ws[ref]={t:'n',v:+String(raw).replace(/,/g,'')};else ws[ref]={t:'s',v:String(raw)};maxC=Math.max(maxC,c)}));
      ws['!ref']=XLSX.utils.encode_range({s:{r:0,c:0},e:{r:Math.max(0,sh.rows.length-1),c:maxC}});
      XLSX.utils.book_append_sheet(wb,ws,sh.name.slice(0,31)||'Sheet')});
    return{name:baseName(d.name)+'.xlsx',mime:XLSXM,b64:XLSX.write(wb,{bookType:'xlsx',type:'base64'})};
  }
  if(view==='slides'){const t=d.slides.map((sl,i)=>(i+1)+'. '+sl.title+'\n'+sl.lines.map(l=>'   - '+l).join('\n')).join('\n\n');return{name:baseName(d.name)+'.txt',mime:'text/plain',b64:txtB64(t)}}
  if(view==='reader'){
    if(d.type==='pdf')return{name:d.name,mime:'application/pdf',b64:await blobB64(new Blob([d.buf]))};
    if(d.type==='image'){const bl=await(await fetch(d.url)).blob();return{name:d.name,mime:bl.type||'image/*',b64:await blobB64(bl)}}
  }
  return null;
}
async function saveDoc(){
  if(view==='slides'){toast('Saving presentations is coming soon. Use Share to send the text.');return}
  const N=window.DeskworkNative;
  if(!N||!N.save){toast('Saving works in the installed Deskwork app.');return}
  busy(true);
  try{const x=await exportDoc();if(!x)return;const r=N.save(x.name,x.mime,x.b64);toast(r?'Saved to '+r:'Could not save the file.')}
  catch(e){console.error(e);toast('Could not save the file.')}
  finally{busy(false)}
}
async function shareDoc(){
  const d=cur[view];if(!d||view==='home')return;
  const N=window.DeskworkNative;
  if(!N||!N.share){toast('Sharing works in the installed Deskwork app.');return}
  busy(true);
  try{
    let ok;
    if(d.type==='pdfn')ok=N.sharePdf(d.id,d.name);
    else{const x=await exportDoc();ok=x?N.share(x.name,x.mime,x.b64):false}
    if(!ok)toast('Could not share the file.');
  }catch(e){console.error(e);toast('Could not share the file.')}
  finally{busy(false)}
}
$('#saveBtn').addEventListener('click',saveDoc);
$('#shareBtn').addEventListener('click',shareDoc);
window.__dwExport=exportDoc;
