name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download offline libraries
        run: |
          mkdir -p www/lib && cd www/lib
          B=https://cdnjs.cloudflare.com/ajax/libs
          curl -fsSLO $B/mammoth/1.6.0/mammoth.browser.min.js
          curl -fsSLO $B/xlsx/0.18.5/xlsx.full.min.js
          curl -fsSLO $B/jszip/3.10.1/jszip.min.js
          curl -fsSLO $B/pdf.js/3.11.174/pdf.min.js
          curl -fsSLO $B/pdf.js/3.11.174/pdf.worker.min.js
      - run: npm install
      - name: Add Word page-view library
        run: |
          cp node_modules/docx-preview/dist/docx-preview.min.js www/lib/docx-preview.min.js || cp node_modules/docx-preview/dist/docx-preview.js www/lib/docx-preview.min.js
      - run: npx cap add android
      - name: Add file-opening support
        run: |
          cp native/MainActivity.java android/app/src/main/java/com/deskwork/app/MainActivity.java
          cp native/ShareProvider.java android/app/src/main/java/com/deskwork/app/ShareProvider.java
          python3 native/patch_manifest.py
      - run: npx cap sync android
      - name: Use a fixed signing key so updates install over the old app
        run: |
          mkdir -p ~/.android && cp native/debug.keystore ~/.android/debug.keystore
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          sed -i 's/networkTimeout=10000/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3; do ./gradlew assembleDebug && exit 0; echo "Build attempt $i failed, retrying"; sleep 20; done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Deskwork-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
